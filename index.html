<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 2 - Calculadora WEB</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="encabezado-tarea">
    <h1>Tarea 2 - Danely Pamela</h1>
</header>

    <main class="contenedor">
        <section class="calculadora">
            <header class="calc-header">
                <h2>Calculadora WEB</h2>
            </header>

            <!-- aquí el resultado -->
            <input type="text" id="pantalla" class="pantalla" readonly value="0">

            <!-- Mis botines -->
            <div class="botones">
                <button type="button" class="btn btn-accion" onclick="limpiarPantalla()">C</button>
                <button type="button" class="btn btn-accion" onclick="borrarUltimo()">DEL</button>
                <button type="button" class="btn btn-operador" onclick="agregarOperador('/')">&divide;</button>
                <button type="button" class="btn btn-operador" onclick="agregarOperador('*')">&times;</button>

                <button type="button" class="btn" onclick="agregarNumero('7')">7</button>
                <button type="button" class="btn" onclick="agregarNumero('8')">8</button>
                <button type="button" class="btn" onclick="agregarNumero('9')">9</button>
                <button type="button" class="btn btn-operador" onclick="agregarOperador('-')">-</button>

                <button type="button" class="btn" onclick="agregarNumero('4')">4</button>
                <button type="button" class="btn" onclick="agregarNumero('5')">5</button>
                <button type="button" class="btn" onclick="agregarNumero('6')">6</button>
                <button type="button" class="btn btn-operador" onclick="agregarOperador('+')">+</button>

                <button type="button" class="btn" onclick="agregarNumero('1')">1</button>
                <button type="button" class="btn" onclick="agregarNumero('2')">2</button>
                <button type="button" class="btn" onclick="agregarNumero('3')">3</button>
                <button type="button" class="btn btn-igual" onclick="calcularResultado()">=</button>

                <button type="button" class="btn btn-cero" onclick="agregarNumero('0')">0</button>
                <button type="button" class="btn" onclick="agregarNumero('.')">.</button>
            </div>
        </section>

        <!-- aquí uso localStorage para el historial -->
        <section class="panel-historial">
            <div class="historial-header">
                <h3>Historial de Cálculos</h3>
                <button type="button" class="btn-borrar-historial" onclick="borrarHistorial()">Eliminar Historial</button>
            </div>
            <ul id="lista-historial" class="lista-historial"></ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
